[project]
name = "{project_name}"
version = "0.1.0"
description = "Open-weights GenAI model serving and benchmarking workspace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-models-cli>=0.1.0",
    "google-cloud-aiplatform>=1.44.0",
    "google-cloud-storage>=2.14.0",
    "python-dotenv>=1.0.0",
    "inference-perf>=0.6.0",
]

[project.optional-dependencies]
benchmark = [
    "matplotlib>=3.8.0",
]
