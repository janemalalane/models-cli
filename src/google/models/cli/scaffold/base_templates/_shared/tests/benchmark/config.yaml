# inference-perf Benchmark Configuration
# Note: Server endpoint and model are dynamically injected from .env or CLI options.
api:
  type: completion
  streaming: true
data:
  type: shareGPT 
  input_distribution:
    min: 10
    max: 1024
    mean: 512
    std_dev: 100
  output_distribution:
    min: 10
    max: 256
    mean: 128
    std_dev: 30
load:
  type: constant
  interval: 1.0
  stages:
  - rate: 2.0
    duration: 10
  - rate: 5.0
    duration: 20
  - rate: 10.0
    duration: 30
report:
  request_lifecycle:
    summary: true
    per_stage: true
    per_request: true
    percentiles:
    - 50.0
    - 90.0
    - 95.0
    - 99.0
storage:
  local_storage:
    path: null
    report_file_prefix: null 
server:
  type: vllm
  model_name: null
  base_url: null
  api_key: null
tokenizer:
  pretrained_model_name_or_path: "{model_id}"

